<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/Favicon.png" />
    <title>Profil Pengguna - CINEHUB</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top px-4">
      <a class="navbar-brand fw-bold text-danger fs-3" href="index.html">CINEHUB</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-4">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="disimpan.html">Disimpan</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="user.html">Profil</a>
          </li>
        </ul>
      </div>

      <div class="d-flex align-items-center ms-auto">
        <img src="assets/user.png" class="rounded-circle" width="35" alt="User" />
      </div>
    </nav>

    <!-- Konten Profil -->
    <div class="main-wrapper">
      <div class="container-fluid content">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card bg-dark text-white border-secondary mt-5">
              <div class="card-body text-center">
                <img
                  src="assets/user.png"
                  width="100"
                  class="rounded-circle mb-3"
                  alt="User"
                />
                <h5 class="fw-bold mb-1">Calvin</h5>
                <p class="text-secondary mb-3">Member sejak 2025</p>
                <button class="btn btn-danger mb-3">Edit Profil</button>

                <hr class="border-secondary" />

                <!-- Bagian Film Disimpan -->
                <h6 class="fw-bold text-white mt-3">Film Disimpan</h6>
                <div class="movie-carousel mb-3">
                  <button class="scroll-btn left">&#10094;</button>
                  <div class="movie-row">
                    <div class="movie-item text-center me-2">
                      <img
                        src="assets/Adaapadengancinta.JPG"
                        class="movie-poster"
                        alt="Ada Apa Dengan Cinta"
                      />
                      <p class="mt-2 text-secondary small">Ada Apa Dengan Cinta (2002)</p>
                    </div>
                    <div class="movie-item text-center me-2">
                      <img
                        src="assets/DK.jpg"
                        class="movie-poster"
                        alt="DK"
                      />
                      <p class="mt-2 text-secondary small">DK (2024)</p>
                    </div>
                  </div>
                  <button class="scroll-btn right">&#10095;</button>
                </div>

                <hr class="border-secondary" />

                <h6 class="fw-bold text-white mt-3">Langganan</h6>
                <p class="text-secondary">
                  Paket Premium - Berlaku hingga 31 Desember 2025
                </p>
                <button class="btn btn-outline-light btn-sm">Perpanjang</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer
      class="bg-dark text-secondary pt-5 pb-4 border-top border-secondary-subtle mt-5"
    >
      <div class="text-center">
        <small>Copyright &copy; 2025 - CineHub. All Rights Reserved.</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="style.js"></script>
  </body>
</html>
